name: API CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/api-ci.yml"

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore StudentStudyHub.slnx

      - name: Build
        run: dotnet build StudentStudyHub.slnx --no-restore -c Release

      - name: Test
        run: dotnet test StudentStudyHub.slnx --no-build -c Release

      - name: Check for vulnerable packages
        run: dotnet list StudentStudyHub.slnx package --vulnerable --include-transitive
